[project]

site_name = "Padwan LLM"
site_description = "Unified async client for OpenAI, Gemini, Mistral, and Grok APIs"
site_url = "https://polarsen-io.github.io/padwan-llm"

repo_url = "https://github.com/polarsen-io/padwan-llm"
repo_name = "polarsen-io/padwan-llm"

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mermaid.mjs"]

nav = [
  { "Introduction" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Clients" = [
    { "OpenAI-Compatible" = "clients/openai-compatible.md" },
    { "OpenAI" = "clients/openai.md" },
    { "Gemini" = "clients/gemini.md" },
    { "Mistral" = "clients/mistral.md" },
    { "Grok" = "clients/grok.md" },
  ] },
  { "MCP" = "mcp.md" },
  { "Agents" = "agents.md" },
]

[project.theme]

logo = "static/logo-hood.png"
favicon = "static/favicon.png"
features = [
  "navigation.sections",
  "navigation.top",
  "navigation.expand",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.integrate",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown extensions

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
