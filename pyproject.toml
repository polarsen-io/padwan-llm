[project]
name = "padwan-llm"
version = "0.9.1"
authors = [
    { email = "julien.brayere@polarsen.io" }
]
requires-python = ">=3.13"
dependencies = [
    "niquests>=3.21.0",
    "qh3>=1.7.1",
    "urllib3-future>=2.19.908",
]

[project.optional-dependencies]
langfuse = ["langfuse>=4.9", "opentelemetry-api>=1.44"]
otel = ["opentelemetry-api>=1.44"]
realtime = ["niquests[ws]>=3.21.0"]

[project.scripts]
padwan-llm = "padwan_llm.__main__:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "padwan_llm"


[dependency-groups]
dev = [
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-sdk>=1.44",
    "prek>=0.2.30",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.2",
]
llms = [
    "anthropic>=1.0.0",
    "google-genai>=2.18.1",
    "mcp>=2.0.0",
    "openai>=3.3.0",
    # grpcio (via xai-sdk) has no 3.15 wheels yet and segfaults when built from source
    "xai-sdk>=1.19.0; python_version < '3.15'",
]
research = [
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
]
docs = [
    "zensical>=0.0.31",
]
bump = [
    "commitizen>=4.0.0",
]

[tool.ruff.lint]
# Pin the pre-ruff-0.16 default rule set; adopting the expanded defaults
# (BLE, SIM, S, TC, ...) is a separate cleanup.
select = ["E4", "E7", "E9", "F", "G", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
# Without include, pyright walks SDK source via imports and OOMs.
include = ["padwan_llm", "tests"]
# bin/ holds PEP 723 inline scripts with their own dep envs.
exclude = ["bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=padwan_llm --cov-report=term-missing -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring real API keys",
    "otel_expect_error: test whose spans are expected to end in ERROR status under --otel",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
bump_message = "chore(release): release $current_version → $new_version [skip ci]"

[tool.coverage.run]
source = ["padwan_llm"]
omit = ["padwan_llm/__init__.py", "padwan_llm/*/types.py"]
