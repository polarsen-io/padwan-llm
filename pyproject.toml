[project]
name = "padwan-llm"
version = "0.2.0"
authors = [
    { email = "julien.brayere@polarsen.io" }
]
requires-python = ">=3.14"
dependencies = [
    "niquests>=3.17.0",
]

[project.scripts]
padwan-llm = "padwan_llm.__main__:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "padwan_llm"

[dependency-groups]
dev = [
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "prek>=0.2.30",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "xai-sdk>=1.7.0",
]
research = [
    "jupyter>=1.1.1",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]
bump = [
    "commitizen>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=padwan_llm --cov-report=term-missing -m 'not e2e'"
markers = ["e2e: end-to-end tests requiring real API keys"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
bump_message = "chore(release): release $current_version → $new_version [skip ci]"

[tool.coverage.run]
source = ["padwan_llm"]
omit = ["padwan_llm/__init__.py", "padwan_llm/*/types.py"]
