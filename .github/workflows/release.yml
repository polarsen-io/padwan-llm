name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Extract version from branch name
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION="${HEAD_REF#release/}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$HEAD_REF" ]; then
            echo "error: could not extract version from $HEAD_REF" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Save PR body as release notes
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "error: PR body is empty — refusing to release" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Build package
        run: uv build

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Polarsen bot"
          git config user.email "bot@polarsen.io"
          git tag -a "$VERSION" -F RELEASE_NOTES.md
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          token: ${{ secrets.POLARSEN_BOT_PAT }}

      - name: Publish to PyPI
        run: uv publish
